name: Deploy support site to Cloudflare Pages

on:
  workflow_dispatch:

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    name: Deploy docs to Cloudflare Pages
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Wrangler
        run: npm install -g wrangler@3

      - name: Verify Cloudflare credentials
        run: wrangler whoami

      - name: Deploy to Cloudflare Pages
        run: |
          set -x
          wrangler pages deploy docs --project-name=cad-commands --commit-dirty=true 2>&1 | tee deploy.log
          echo ""
          echo "=== Deployment output above ==="
          grep -i "pages.dev" deploy.log || true
