name: Deploy support site to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/deploy-cloudflare-pages.yml"
  workflow_dispatch:

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    name: Deploy docs to Cloudflare Pages
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Wrangler
        run: npm install -g wrangler@3

      - name: Verify Cloudflare credentials
        run: |
          echo "Checking Cloudflare account access..."
          wrangler whoami
          echo ""
          echo "Existing Pages projects:"
          wrangler pages project list

      - name: Create Pages project if needed
        run: |
          wrangler pages project create cad-commands --production-branch=main || true

      - name: Deploy to Cloudflare Pages
        run: |
          wrangler pages deploy docs \
            --project-name=cad-commands \
            --branch=main \
            --commit-dirty=true

      - name: Confirm deployment
        run: |
          echo "Pages projects after deploy:"
          wrangler pages project list
