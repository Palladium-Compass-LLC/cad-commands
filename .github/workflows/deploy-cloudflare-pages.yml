name: Deploy support site to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/deploy-cloudflare-pages.yml"
  workflow_dispatch:

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    name: Deploy docs to Cloudflare Pages
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Wrangler
        run: npm install -g wrangler@3

      - name: Verify Cloudflare credentials
        run: wrangler whoami

      - name: Ensure Pages project exists
        run: |
          response="$(curl -sS -w "\n%{http_code}" \
            -X POST "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"name":"cad-commands","production_branch":"main"}')"
          http_code="$(echo "$response" | tail -n1)"
          body="$(echo "$response" | sed '$d')"
          echo "$body"
          if [[ "$http_code" != "200" && "$http_code" != "409" ]]; then
            echo "Failed to ensure Pages project exists (HTTP ${http_code})."
            exit 1
          fi

      - name: Deploy to Cloudflare Pages
        run: wrangler pages deploy docs --project-name=cad-commands --commit-dirty=true
